# Gateway: one nginx, three origins.
#   :3001  Lakeshore Community Bank portal  (FI portal build, branded at runtime by /config.js)
#   :3002  Prairie Valley Credit Union portal
#   :3100  Demo Control Center (DEMO-ONLY, presenter tooling)
#
# WHY separate origins per FI: each FI's customers use that FI's URL, and browser storage is isolated per
# origin, so a presenter can be signed in at Lakeshore and Prairie at the same time. /api/core goes to the
# portal's OWN FI's Core only: one Core per FI, nothing shared.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  # Docker's embedded DNS. Resolving at request time (variables in proxy_pass) lets nginx start, and keep
  # serving the portals, while an upstream container is stopped by a chaos action.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # WHY: account numbers appear in request paths (POST /api/core/accounts/{account}/hold), and nothing may log
  # an unmasked account number. The access log records the path with the account masked to its last four digits
  # (ASCII "**": nginx escapes non-ASCII bytes in logs).
  map $request_uri $masked_request_uri {
    "~^(?<before>.*/accounts/)[0-9]+(?<last4>[0-9]{4})(?<after>.*)$" "${before}**${last4}${after}";
    default $request_uri;
  }
  log_format masked '$remote_addr - $remote_user [$time_local] "$request_method $masked_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log masked;
  # PRODUCTION NOTE: nginx's error log format is fixed and includes the raw request line when an upstream fails
  # (e.g. a hold placed while Core is stopped). A production gateway would carry account identifiers in request
  # bodies or opaque references rather than paths, or ship logs through a masking pipeline.

  # ------------------------------------------------------------------ Lakeshore portal
  server {
    listen 3001;
    root /usr/share/nginx/portal;

    location = /config.js {
      default_type application/javascript;
      add_header Cache-Control "no-store";
      return 200 'window.FI_ID = "lakeshore";';
    }

    # Service-to-service and admin routes are never reachable from a portal.
    location ~ ^/api/(bulkwire|core)/(internal|admin)(/|$) { return 404; }
    location ~ /(internal|admin)(/|$) { return 404; }

    location /api/bulkwire/ {
      set $bw bulkwire-service:8090;
      rewrite ^/api/bulkwire/(.*)$ /api/$1 break;
      proxy_pass http://$bw;
      proxy_read_timeout 60s;
    }
    location /api/core/ {
      set $core core-lakeshore:8080;
      rewrite ^/api/core/(.*)$ /api/$1 break;
      proxy_pass http://$core;
      proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }

  # ------------------------------------------------------------------ Prairie portal
  server {
    listen 3002;
    root /usr/share/nginx/portal;

    location = /config.js {
      default_type application/javascript;
      add_header Cache-Control "no-store";
      return 200 'window.FI_ID = "prairie";';
    }

    location ~ ^/api/(bulkwire|core)/(internal|admin)(/|$) { return 404; }
    location ~ /(internal|admin)(/|$) { return 404; }

    location /api/bulkwire/ {
      set $bw bulkwire-service:8090;
      rewrite ^/api/bulkwire/(.*)$ /api/$1 break;
      proxy_pass http://$bw;
      proxy_read_timeout 60s;
    }
    location /api/core/ {
      set $core core-prairie:8080;
      rewrite ^/api/core/(.*)$ /api/$1 break;
      proxy_pass http://$core;
      proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }

  # ------------------------------------------------------------------ Demo Control Center (DEMO-ONLY)
  server {
    listen 3100;
    root /usr/share/nginx/control;

    location /api/control/ {
      set $cs control-service:8095;
      rewrite ^/api/control/(.*)$ /api/$1 break;
      proxy_pass http://$cs;
      # Reset and load generation run for tens of seconds.
      proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
